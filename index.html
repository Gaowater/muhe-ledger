<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-build="20260826-0007">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牧河账本</title>
<script src="supabase.min.js"></script>
<style>
:root{
  --bg:#f5f5f7; --surface:#ffffff; --surface-2:#f0f0f2;
  --text:#1d1d1f; --text-2:#6e6e73; --text-3:#a1a1a6;
  --line:rgba(0,0,0,.09);
  --accent:#0071e3;
  --pos:#1d9e6a; --neg:#d64541;
  --ring-bg:#ececee;
  --ease-expo:cubic-bezier(.16,1,.3,1);
  --ease-quart:cubic-bezier(.25,1,.5,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:tabular-nums;
}
[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --surface-2:#2c2c2e;
  --text:#f5f5f7; --text-2:#a1a1a6; --text-3:#6e6e73;
  --line:rgba(255,255,255,.12);
  --accent:#0a84ff;
  --pos:#30d158; --neg:#ff453a;
  --ring-bg:#2c2c2e;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:var(--font);background:var(--bg);color:var(--text);
  min-height:100vh;line-height:1.5;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  transition:background .3s var(--ease-quart),color .3s var(--ease-quart);
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;touch-action:manipulation}
[hidden]{display:none!important}
svg{display:block}
.num{font-variant-numeric:var(--num)}

.app{max-width:1120px;margin:0 auto;padding:0 20px 96px}

.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:18px;height:56px;position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.brand{font-size:17px;font-weight:600;letter-spacing:.02em;justify-self:start}
.topbar-right{display:flex;align-items:center;gap:4px;justify-self:end}
.icon-btn{width:40px;height:40px;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--text-2);transition:background .15s var(--ease-quart),color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}
.icon-btn:active{transform:scale(.92)}
.month-nav{display:flex;align-items:center;gap:2px;justify-self:center}
.month-nav .icon-btn{width:36px;height:36px}
.month-label{min-width:96px;text-align:center;font-size:14px;font-weight:500;color:var(--text-2)}

.main{margin-top:12px}
.view{animation:viewIn .35s var(--ease-quart) both}

@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.hero{background:var(--surface);border-radius:24px;padding:28px 24px 24px;border:1px solid var(--line)}
.hero-label{font-size:13px;color:var(--text-2)}
.hero-balance{font-size:clamp(40px,8vw,56px);font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.1}
.hero-sub{display:flex;gap:28px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.hero-item{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.hero-item b{font-weight:500;color:var(--text);font-variant-numeric:tabular-nums}
.hero-item .pos{color:var(--pos)}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.pos{background:var(--pos)}
.dot.neg{background:var(--neg)}

.add-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;height:52px;border-radius:16px;margin-top:16px;
  background:var(--text);color:var(--bg);font-size:16px;font-weight:500;
  transition:transform .12s var(--ease-quart),opacity .12s;
}
.add-btn:active{transform:scale(.98);opacity:.85}
.add-btn svg{width:20px;height:20px}

.list{margin-top:28px}
.group{margin-bottom:24px}
.group-label{font-size:13px;color:var(--text-2);padding:0 4px 10px;display:flex;align-items:baseline;gap:8px}
.group-label .gdate{font-variant-numeric:tabular-nums}
.row{
  display:flex;align-items:center;gap:12px;padding:10px 4px;
  border-bottom:1px solid var(--line);animation:viewIn .4s var(--ease-expo) both;animation-delay:calc(var(--i,0)*45ms)
}
.cat-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.cat-icon svg{width:21px;height:21px}
.row-main{flex:1;min-width:0}
.row-title{font-size:15px;font-weight:500}
.row-note{font-size:12px;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.row-amount{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.row-amount.out{color:var(--text)}
.row-amount.in{color:var(--pos)}

.empty{padding:56px 24px;text-align:center;color:var(--text-2);font-size:14px;line-height:2}

.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{flex:1;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text-2);transition:color .2s var(--ease-quart)}
.tab svg{width:22px;height:22px}
.tab.active{color:var(--accent)}

/* 统计 */
.stats-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.stats-title{font-size:13px;color:var(--text-2);margin-bottom:20px}
.ring-wrap{display:flex;align-items:center;gap:24px}
.ring-box{position:relative;width:148px;height:148px;flex:none}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--ring-bg);stroke-width:15}
.ring-seg{fill:none;stroke-width:15;stroke-linecap:butt;transition:stroke-dashoffset .8s var(--ease-expo),stroke-dasharray .8s var(--ease-expo)}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring-center span{font-size:12px;color:var(--text-2)}
.ring-center b{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.ring-legend{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0;max-height:152px;overflow-y:auto}
.lg-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2);min-width:0}
.lg-row .dot{width:10px;height:10px;flex:none}
.lg-row b{color:var(--text);font-weight:500;font-variant-numeric:tabular-nums}
.lg-row .pct{color:var(--text-3);font-variant-numeric:tabular-nums}

.stats-list{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:8px 24px 16px}
.srow{display:grid;grid-template-columns:14px 1fr auto 44px;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:none}
.srow .dot{width:10px;height:10px}
.sname{font-size:14px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.samount{font-size:14px;font-weight:500;font-variant-numeric:tabular-nums}
.spct{font-size:12px;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums}
.sbar{grid-column:1/-1;height:3px;border-radius:2px;background:var(--ring-bg);margin-top:2px;overflow:hidden}
.sbar i{display:block;height:100%;border-radius:2px;width:0;transition:width .7s var(--ease-expo)}

.stats-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.ssum{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.ssum span{font-size:12px;color:var(--text-2);display:block}
.ssum b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;display:block}
.ssum b.in{color:var(--pos)}
.ssum b.out{color:var(--neg)}

/* 支出趋势折线 */
.trend-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px;margin-top:16px}
.trend-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.trend-head .stats-title{margin-bottom:0}
.seg{display:flex;background:var(--surface-2);border-radius:10px;padding:2px;gap:2px}
.seg button{height:30px;padding:0 14px;border-radius:8px;font-size:12px;color:var(--text-2);transition:all .2s var(--ease-quart)}
.seg button.active{background:var(--surface);color:var(--text);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.07)}
.trend-chart{width:100%;height:auto;display:block;touch-action:pan-y;cursor:crosshair}
.trend-line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.trend-area{fill:color-mix(in srgb,var(--accent) 9%,transparent)}
.trend-dot{fill:var(--surface);stroke:var(--accent);stroke-width:2;pointer-events:none}
.grid-line{stroke:var(--line);stroke-width:1}
.trend-axis{font-size:11px;fill:var(--text-3);font-variant-numeric:tabular-nums;font-family:var(--font)}
.trend-axis-cap{font-size:9px;fill:var(--text-3);opacity:0.6}
.trend-crosshair{stroke:var(--text-3);stroke-width:1;stroke-dasharray:3 3;opacity:0.8;pointer-events:none}
.trend-dot-active{fill:var(--accent);stroke:#fff;stroke-width:2;pointer-events:none}
.trend-wrap{position:relative}
.trend-tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px;box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12px;line-height:1.45;color:var(--text);transform:translate(-50%,-100%);z-index:5;white-space:nowrap;transition:opacity .12s var(--ease-quart)}
.trend-tip .tt-date{font-size:11px;color:var(--text-2)}
.trend-tip .tt-val{font-weight:600;font-variant-numeric:tabular-nums}

/* 搜索 */
.search-wrap{position:relative;margin-top:16px}
.search-input{width:100%;height:44px;border-radius:12px;background:var(--surface-2);border:none;padding:0 44px 0 40px;font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:background .2s var(--ease-quart)}
.search-input:focus{background:var(--surface);box-shadow:0 0 0 1.5px var(--accent) inset}
.search-input::placeholder{color:var(--text-3)}
.search-input::-webkit-search-cancel-button{-webkit-appearance:none}
.filter-bar{display:flex;background:var(--surface-2);border-radius:11px;padding:3px;margin-top:12px}
.fseg{flex:1;height:34px;border-radius:8px;font-size:13px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease-quart)}
.fseg.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--text-3)}
.search-clear:hover{background:var(--surface);color:var(--text)}
/* hero 小结 */
.hero-note{margin-top:14px;font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums}
/* 快捷金额 */
.quick-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:6px}
.quick-chip{height:34px;padding:0 16px;border-radius:17px;background:var(--surface-2);font-size:14px;font-weight:500;font-variant-numeric:tabular-nums;color:var(--text-2);transition:all .15s var(--ease-quart)}
.quick-chip:active{transform:scale(.94);background:var(--text-3);color:var(--surface)}
/* 日期行 */
.date-row{display:flex;align-items:center;gap:10px;margin-top:10px}
.date-row label{font-size:14px;color:var(--text-2);flex:none}
.date-input{flex:1;height:44px;background:var(--surface-2);border:none;border-radius:12px;padding:0 14px;font-size:15px;font-family:inherit;color:var(--text);outline:none}
/* 删除按钮 */
.del-btn{margin-top:10px;height:46px;padding:0 18px;border-radius:14px;background:var(--surface-2);color:var(--neg);font-size:15px;font-weight:500;line-height:1;white-space:nowrap;display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.del-btn:active{background:var(--neg);color:var(--surface)}
/* 预算 */
.budget-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px 24px;margin-top:16px}
.budget-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.budget-head .stats-title{margin-bottom:0}
.budget-add{width:34px;height:34px;border-radius:17px;display:flex;align-items:center;justify-content:center;color:var(--text-2);background:var(--surface-2);transition:all .15s}
.budget-add:hover{color:var(--text)}
.budget-row{display:grid;grid-template-columns:1fr auto;gap:7px 12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}
.budget-row:last-of-type{border-bottom:none}
.budget-row:active{background:var(--surface-2)}
.budget-name{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;min-width:0}
.budget-amt{font-size:13px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.budget-track{grid-column:1/-1;height:6px;border-radius:3px;background:var(--ring-bg);overflow:hidden}
.budget-track i{display:block;height:100%;border-radius:3px;width:0;transition:width .6s var(--ease-expo)}
.budget-empty{font-size:13px;color:var(--text-2);padding:10px 0 2px;line-height:1.7}
/* 行可点击 */
.row.editable{cursor:pointer}
.row.editable:active{background:var(--surface-2)}
/* 同步设置 */
.set-hint{font-size:13px;color:var(--text-2);line-height:1.7;margin-bottom:6px}
.set-label{display:block;font-size:13px;color:var(--text-2);margin:12px 0 6px}
.set-input{width:100%;height:44px;background:var(--surface-2);border:none;border-radius:12px;padding:0 14px;font-size:14px;font-family:inherit;color:var(--text);outline:none;transition:box-shadow .15s}
.set-input:focus{box-shadow:0 0 0 1.5px var(--accent) inset}
.set-input::placeholder{color:var(--text-3)}
/* 比账 */
.cmp-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;max-width:480px;margin:0 auto}
.cmp-title{font-size:18px;font-weight:600}
.cmp-desc{font-size:13px;color:var(--text-2);margin:8px 0 4px;line-height:1.6}
.cmp-gen{display:block;text-align:center;margin-top:14px;font-size:13px;color:var(--accent)}
.cmp-card .save-btn{width:100%}
.cmp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.cmp-edit{font-size:13px;color:var(--text-2);padding:7px 12px;border-radius:10px;background:var(--surface-2);white-space:nowrap}
.cmp-me{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;text-align:center}
.cmp-me div span{display:block;font-size:12px;color:var(--text-2)}
.cmp-me div b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp-duel{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.cmp-duel-empty{grid-column:1/-1;background:var(--surface);border:1px dashed var(--line);border-radius:20px;padding:30px 20px;text-align:center;color:var(--text-2);font-size:13px;line-height:1.7}
.cmp-card-name{font-size:15px;font-weight:600;text-align:center}
.cmp-card.me{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.cmp-card-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-top:12px}
.cmp-card-stats span{display:block;font-size:11px;color:var(--text-2)}
.cmp-card-stats b{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.cmp-card-vs{text-align:center;font-size:12px;color:var(--text-2);margin-top:12px}
.cmp-list-title{font-size:13px;color:var(--text-2);margin:20px 0 10px;font-weight:500}
.cmp-list{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.cmp-row{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text-2)}
.cmp-row:last-child{border-bottom:none}
.cmp-row.me{background:color-mix(in srgb,var(--accent) 7%,transparent);color:var(--text)}
.cmp-row .cmp-rank{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--text-2);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.cmp-row:nth-child(1) .cmp-rank{background:#f5a623;color:#fff}
.cmp-row:nth-child(2) .cmp-rank{background:#b8bec6;color:#fff}
.cmp-row:nth-child(3) .cmp-rank{background:#c98a5e;color:#fff}
.cmp-nick{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmp-row-vals{white-space:nowrap;font-variant-numeric:tabular-nums}
.cmp-row-vals b{font-variant-numeric:tabular-nums}
.cmp-refresh{margin-top:14px;height:42px;border-radius:12px;background:var(--surface-2);color:var(--text-2);font-size:14px;font-weight:500;width:100%;transition:background .15s}
.cmp-refresh:hover{background:var(--line)}
.set-status{font-size:12px;color:var(--text-2);margin-top:10px;line-height:1.6;min-height:18px}
.set-status.ok{color:var(--pos)}
.set-status.err{color:var(--neg)}

/* 记一笔 */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:40;animation:fadeIn .2s ease both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--surface);border-radius:24px 24px 0 0;
  max-height:88vh;display:flex;flex-direction:column;
  padding:12px 20px calc(20px + env(safe-area-inset-bottom));
  animation:sheetUp .38s var(--ease-expo) both;
  border-top:1px solid var(--line);
}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-grab{width:36px;height:4px;border-radius:2px;background:var(--text-3);margin:0 auto 14px;flex:none}
.sheet-scroll{overflow-y:auto;min-height:0;-webkit-overflow-scrolling:touch}
.sheet-fixed{flex:none}
.sheet-body{display:flex;flex-direction:column}
.sheet-left,.sheet-right{min-width:0}
.keypad.dk{display:none}
.actions-row{display:flex;gap:10px;margin-top:14px;flex:none}
.actions-row .del-btn{flex:1;margin-top:0;white-space:nowrap}
.actions-row .save-btn{flex:2;margin-top:0;white-space:nowrap}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sheet-head h2{font-size:17px;font-weight:600}
.type-switch{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;margin-top:12px}
.tseg{flex:1;height:38px;border-radius:10px;font-size:14px;font-weight:500;color:var(--text-2);transition:all .2s var(--ease-quart)}
.tseg.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-row{display:flex;align-items:baseline;justify-content:center;gap:8px;padding:26px 0 18px}
.amount-row .cur{font-size:28px;font-weight:600;color:var(--text-2)}
.amount-display{font-size:52px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums;min-height:60px}
.cat-pager{position:relative}
.cat-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.cat-track::-webkit-scrollbar{display:none}
.cat-page{flex:none;width:100%;display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px;scroll-snap-align:start;padding:4px 2px 12px}
.cat-dots{display:flex;justify-content:center;gap:6px;padding-bottom:10px}
.cat-dots span{width:6px;height:6px;border-radius:3px;background:var(--text-3);opacity:.35;transition:all .25s var(--ease-quart)}
.cat-dots span.on{opacity:1;width:18px;background:var(--text-2)}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--text-2)}
.cat-btn .cwrap{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;transition:all .18s var(--ease-quart)}
.cat-btn .cwrap svg{width:24px;height:24px}
.cat-btn.selected .cwrap{transform:scale(1.06)}
.cat-btn.selected{color:var(--text);font-weight:500}
.note-input{
  width:100%;height:46px;background:var(--surface-2);border-radius:12px;border:none;
  padding:0 16px;font-size:15px;font-family:inherit;color:var(--text);outline:none;
  margin-top:4px;
}
.note-input::placeholder{color:var(--text-3)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;flex:none}
.key{
  height:52px;border-radius:14px;background:var(--surface-2);font-size:22px;font-weight:500;
  display:flex;align-items:center;justify-content:center;transition:background .1s,transform .1s;
}
.key:active{background:var(--text-3);transform:scale(.96)}
.key svg{width:22px;height:22px}
.save-btn{
  margin-top:14px;height:52px;border-radius:16px;font-size:16px;font-weight:500;flex:none;
  background:var(--text);color:var(--bg);transition:opacity .2s,transform .12s var(--ease-quart);
}
.save-btn:disabled{opacity:.35;cursor:default}
.save-btn:not(:disabled):active{transform:scale(.98)}

/* 窄屏：顶部导航居中但收紧间距，避免溢出 */
@media (max-width:640px){
  .topbar{gap:6px;padding:0 8px}
  .topbar .brand{font-size:14px}
  .month-label{min-width:76px;font-size:13px}
  .topbar .icon-btn,.month-nav .icon-btn{width:32px;height:32px}
  .cmp-row{grid-template-columns:28px minmax(0,1fr) auto auto;gap:8px;font-size:12px}
  .cmp-row .cmp-row-vals.inc{display:none}
  .cmp-duel{gap:10px}
}

@media (min-width:900px){
  .app{padding:0 32px 48px}
  .tabbar{display:none}
  #viewStats[hidden]{display:block!important}
  #viewCompare[hidden]{display:block!important}
  .main{display:grid;grid-template-areas:"bills stats" "bills compare";grid-template-columns:1fr 1fr;gap:32px;align-items:start}
  #viewBills{grid-area:bills}
  #viewStats{grid-area:stats}
  #viewCompare{grid-area:compare}
  .add-btn{max-width:320px}
  .sheet{left:50%;right:auto;bottom:auto;top:50%;transform:translate(-50%,-50%);width:640px;border-radius:24px;max-height:86vh;animation:sheetPop .35s var(--ease-expo) both}
  .sheet-body{display:grid;grid-template-columns:270px 1fr;gap:28px}
  .sheet-left .type-switch{margin-top:0}
  .cat-track{overflow-y:auto;overflow-x:hidden;scroll-snap-type:none;display:flex;flex-direction:column;max-height:236px}
  .cat-page{width:100%;scroll-snap-align:none}
  .cat-dots{display:none}
  .keypad.dk{display:grid}
  .keypad.mob{display:none}
  @keyframes sheetPop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}

/* 底部"发现新版本"更新提示条（可叉掉） */
.update-bar{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--text);color:var(--bg);padding:10px 10px 10px 18px;border-radius:16px;font-size:13px;box-shadow:0 10px 28px rgba(0,0,0,.18);z-index:60;animation:updIn .3s var(--ease-quart)}
@keyframes updIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
.update-bar button{border:none;background:none;color:inherit;font-size:13px;cursor:pointer;padding:7px 12px;border-radius:10px;white-space:nowrap}
.update-bar #updGo{background:var(--accent);color:#fff;font-weight:500}
.update-bar #updClose{opacity:.55;font-size:15px;padding:7px 8px}
.update-bar #updClose:hover{opacity:1}

/* 【临时验证】隐藏统计模块，用于验证手机端热更新是否立即生效 —— 验证完删除 */
#viewStats{display:none!important}
.tab[data-view="stats"]{display:none!important}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">

    <div class="month-nav">

      <button class="icon-btn" id="exportBtn" aria-label="导出 CSV"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M8 11l4 4 4-4"/><path d="M5 19h14"/></svg></button>

    </div>
  </header>

  <main class="main">
    <section class="view" id="viewBills" aria-label="账单">

        <div class="hero-sub">
          <div class="hero-item"><span class="dot neg"></span>支出 <b class="out" id="expense">¥0.00</b></div>

      <button class="add-btn" id="addBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>记一笔</button>
      <div class="search-wrap">
        <span class="search-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span>
        <input class="search-input" id="searchInput" type="search" placeholder="搜索备注、分类或金额" autocomplete="off" aria-label="搜索账单">

    <section class="view" id="viewStats" aria-label="统计" hidden>

          </div>

        </div>
      </div>
      <div class="stats-list" id="statsList"></div>

        </div>

      <div class="trend-card">

            <div class="tt-val" id="tipVal"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="view" id="viewCompare" aria-label="对比" hidden>
      <div class="cmp-empty" id="cmpEmpty">
        <div class="cmp-card">
          <p class="cmp-title">和 TA 每月比账</p>
          <p class="cmp-desc" id="cmpDesc">创建一个比账码发给对方，或输入 TA 的码加入。记账后自动上传本月汇总，比支出、比收入、比谁记得勤。</p>

          <button class="cmp-gen" id="cmpGen">没有码？点这里生成一个</button>

          <div class="month-nav">
            <button class="icon-btn" id="cmpPrevMonth" aria-label="上个月"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
            <span class="month-label num" id="cmpMonthLabel">—</span>
            <button class="icon-btn" id="cmpNextMonth" aria-label="下个月"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5 16 12l-6.5 6.5"/></svg></button>
          </div>
          <button class="cmp-edit" id="cmpEdit">换房间 / 改昵称</button>
        </div>
        <div class="cmp-me" id="cmpMe"></div>
        <div class="cmp-duel" id="cmpDuel"></div>
        <p class="cmp-list-title">房间月榜</p>
        <div class="cmp-list" id="cmpList"></div>
        <button class="cmp-refresh" id="cmpRefresh">刷新数据</button>
      </div>
    </section>
  </main>
</div>

<div class="backdrop" id="settingsBackdrop" hidden></div>
<div class="sheet" id="settingsSheet" role="dialog" aria-modal="true" aria-label="同步设置" hidden>
  <div class="sheet-scroll">
    <div class="sheet-grab"></div>
    <div class="sheet-head">
      <h2>同步设置</h2>
      <button class="icon-btn" id="closeSettings" aria-label="关闭"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <p class="set-hint">填好下面三项后点「保存并同步」。手机和电脑用同一套配置即可互通，数据存在 Supabase 免费档（500MB，个人记账用不完）。</p>
    <label class="set-label" for="setUrl">项目 URL</label>
    <input class="set-input" id="setUrl" type="text" placeholder="https://xxxx.supabase.co" autocomplete="off" spellcheck="false">
    <label class="set-label" for="setKey">anon 公钥</label>
    <input class="set-input" id="setKey" type="text" placeholder="eyJhbGciOi…（anon public key）" autocomplete="off" spellcheck="false">
    <label class="set-label" for="setOwner">同步口令</label>
    <input class="set-input" id="setOwner" type="text" placeholder="自己设一段私密口令，两端填一样的" autocomplete="off" spellcheck="false">
    <p class="set-status" id="setStatus"></p>
  </div>
  <div class="sheet-fixed">
    <div class="actions-row">
      <button class="del-btn" id="disconnectBtn" hidden>断开同步</button>

})();

function seed(){
  const rows=[];let id=1;
  const today=[
    ['expense','food',32,'午饭'],['expense','trans',8,'公交'],
    ['expense','shop',129,'洗衣液'],['expense','food',45.5,'晚饭'],
    ['expense','fun',58,'电影'],['expense','health',120,'挂号'],
    ['expense','edu',68,'专业书'],['income','living',5436.5,'生活费'],
    ['expense','food',98,'和女朋友吃饭'],['expense','other',300,'电费'],
    ['expense','shop',210,'T恤'],['expense','food',76,'聚餐'],
    ['expense','trans',15,'地铁']];
  const offs=[0,0,1,1,2,3,6,8,10,13,15,16,17];
  today.forEach((r,i)=>rows.push({id:id++,date:daysAgo(offs[i]),type:r[0],cat:r[1],amount:r[2],note:r[3]}));
  const catIds=CATS.map(c=>c.id);
  const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
  for(let k=1;k<=31;k++){
    const d=new Date(now.getFullYear(),now.getMonth()-k,15);
    const cnt=2+Math.floor(rnd(k*3)*2);
    for(let j=0;j<cnt;j++){
      const cat=catIds[Math.floor(rnd(k*7+j*13)*8)];
      const amt=Math.round((18+rnd(k*11+j*5)*260)*10)/10;
      const day=1+Math.floor(rnd(k*17+j*3)*27);
      rows.push({id:id++,date:iso(new Date(d.getFullYear(),d.getMonth(),day)),type:'expense',cat,amount:amt,note:''});
    }
    if(k%6===0)rows.push({id:id++,date:iso(new Date(d.getFullYear(),d.getMonth(),1)),type:'income',cat:'living',amount:3000+Math.round(rnd(k)*2000),note:''});
  }
  return rows;
}

/* Supabase 同步适配层（本地优先，可选云端） */
const sbCfgKey='ledger.supabase.v1';
let sb=null,sbCfg=null;
try{sbCfg=JSON.parse(localStorage.getItem(sbCfgKey)||'null')}catch(e){sbCfg=null}
function sbInit(){
  sb=null;
  if(!sbCfg||!sbCfg.url||!sbCfg.key||!sbCfg.owner||!window.supabase)return;
  try{sb=window.supabase.createClient(sbCfg.url,sbCfg.key,{auth:{persistSession:false}})}catch(e){sb=null}
}
sbInit();
function sbReady(){return !!sb&&!!sbCfg}
let tombIds=[];
try{tombIds=JSON.parse(localStorage.getItem('ledger.tombstones')||'[]')}catch(e){tombIds=[]}
function saveTomb(){localStorage.setItem('ledger.tombstones',JSON.stringify(tombIds))}
let lastSyncAt=+localStorage.getItem('ledger.lastSync')||0;
function saveSyncTs(){lastSyncAt=entries.reduce((mx,e)=>Math.max(mx,+(e.updatedAt||0)),0);localStorage.setItem('ledger.lastSync',String(lastSyncAt))}
function sbPush(){
  if(!sbReady())return Promise.resolve();
  try{
    // 只推"上次同步后新增/修改"的条目（updatedAt > lastSyncAt），防止把云端已删的残留复活
    const rows=entries.filter(e=>(e.updatedAt||0)>lastSyncAt)
      .map(e=>({id:e.id,owner:sbCfg.owner,date:e.date,type:e.type,cat:e.cat,amount:e.amount,note:e.note||'',updated_at:e.updatedAt||Date.now()}));
    // 墓碑总是推送
    const tombstones=tombIds.map(id=>({id,owner:sbCfg.owner,date:'',type:'expense',cat:'other',amount:0,note:'',updated_at:Date.now(),deleted:true}));
    const all=rows.concat(tombstones);
    if(!all.length)return Promise.resolve();
    return sb.from('entries').upsert(all).then(()=>{
      if(tombstones.length){tombIds=tombIds.filter(id=>!tombstones.some(t=>t.id===id));saveTomb()}
      const brows=Object.entries(budgets).map(([cat,amount])=>({cat,owner:sbCfg.owner,amount,updated_at:Date.now()}));
      if(brows.length)return sb.from('budgets').upsert(brows);
    }).catch(e=>{console.warn('sync push failed',e)});
  }catch(e){console.warn('sync push failed',e);return Promise.resolve()}
}
async function sync(){
  if(!sbReady())return;
  try{
    await sbPush(); // 先推新数据与墓碑
    const{data:er,error:e1}=await sb.from('entries').select('*').eq('owner',sbCfg.owner);
    if(e1)throw e1;
    if(er&&er.length){
      const cloudIds=new Set();
      er.forEach(r=>cloudIds.add(r.id));
      // 云端为准：本地有云端无 → 另一端已删；本地新改（lastSyncAt 后）保留
      entries=entries.filter(e=>cloudIds.has(e.id)||(e.updatedAt||0)>lastSyncAt);
      const map={};entries.forEach(x=>map[x.id]=x);
      er.forEach(r=>{
        if(r.deleted){delete map[r.id];return}
        const m=map[r.id];
        if(!m||(r.updated_at||0)>(m.updatedAt||0)){
          map[r.id]={id:r.id,date:r.date,type:r.type,cat:r.cat,amount:r.amount,note:r.note||'',updatedAt:r.updated_at||Date.now()};
        }
      });
      entries=Object.values(map);
    }else if(lastSyncAt>0){
      // 云端被清空：本地旧数据视为已删，跟随清空（保留 lastSyncAt 后的新账）
      entries=entries.filter(e=>(e.updatedAt||0)>lastSyncAt);
      budgets={};
    }
    // 云端空且首次（lastSyncAt=0）：本地保留（已 push 建立全集）
    const{data:br,error:e2}=await sb.from('budgets').select('*').eq('owner',sbCfg.owner);
    if(e2)throw e2;
    if(br&&br.length){const nb={};br.forEach(b=>{nb[b.cat]=b.amount});budgets=nb}
    saveSyncTs();
    save();saveBudgets();render();
    uploadAggregate();
  }catch(e){console.warn('sync merge failed',e)}
}

function renderCmpList(){

function ymParts(k){const[a,b]=k.split('-');return[+a,+b]}
function ymKey(y,m){return `${y}-${pad(m)}`}
function shiftMonth(delta){const[y,m]=ymParts(state.ym);let mm=m+delta,yy=y;if(mm<1){mm=12;yy--}if(mm>12){mm=1;yy++}state.ym=ymKey(yy,mm)}
function monthEntries(){return entries.filter(e=>e.date.startsWith(state.ym))}
function sums(list){let out=0,inc=0;list.forEach(e=>e.type==='expense'?out+=e.amount:inc+=e.amount);return{out,inc}}

function renderTop(){const[y,m]=ymParts(state.ym);monthLabel.textContent=`${y}年${m}月`}
function renderHero(){
  const s=sums(monthEntries());
  balance.textContent=fmt(s.inc-s.out);
  expense.textContent=fmt(s.out);
  income.textContent=fmt(s.inc);
  const[y,m]=ymParts(state.ym);
  const by={};monthEntries().forEach(e=>{if(e.type==='expense')by[e.cat]=(by[e.cat]||0)+e.amount});
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  const pd=new Date(y,m-2,1);
  const prev=sums(entries.filter(e=>e.date.startsWith(ymKey(pd.getFullYear(),pd.getMonth()+1))));
  let txt=`${m}月支出 ${fmt(s.out)}`;
  if(top&&s.out)txt+=`，${catOf(top[0],'expense').name}占 ${Math.round(top[1]/s.out*100)}%`;
  if(prev.out>0){const d=Math.round((s.out-prev.out)/prev.out*100);txt+=d>=0?`，比上月 +${d}%`:`，比上月 −${Math.abs(d)}%`}
  $('heroNote').textContent=txt;
}

function renderRing(){
  const C=2*Math.PI*52;
  const segs=monthEntries().filter(e=>e.type==='expense');
  const by={};segs.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  const arr=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const total=arr.reduce((s,x)=>s+x[1],0);
  ringTotal.textContent=fmt(total);
  document.querySelectorAll('.ring-seg').forEach(n=>n.remove());
  if(!arr.length){
    ringLegend.innerHTML='<p style="font-size:13px;color:var(--text-2)">这个月还没有支出</p>';
    return;
  }
  const ring=document.querySelector('.ring');
  let acc=0;
  arr.forEach(([cat,amt])=>{
    const c=catOf(cat,'expense');
    const seg=amt/total*C;
    const el=document.createElementNS('http://www.w3.org/2000/svg','circle');
    el.setAttribute('class','ring-seg');
    el.setAttribute('cx',60);el.setAttribute('cy',60);el.setAttribute('r',52);
    el.setAttribute('stroke',c.color);
    el.style.strokeDasharray=`0 ${C}`;
    el.style.strokeDashoffset=-acc;
    ring.appendChild(el);
    const target=`${seg} ${C-seg}`;
    void el.getBoundingClientRect();
    el.style.strokeDasharray=target;
    acc+=seg;
  });
  ringLegend.innerHTML=arr.map(([cat,amt])=>{
    const c=catOf(cat,'expense');
    return `<div class="lg-row"><span class="dot" style="background:${c.color}"></span><span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${c.name}</span><b>${fmt(amt)}</b><span class="pct">${Math.round(amt/total*100)}%</span></div>`;
  }).join('');
}

/* 支出趋势折线 */
function smoothPath(pts){
  if(pts.length<2)return'';
  let d=`M${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0]},${p2[1]}`;
  }
  return d;
}
function renderTrend(){
  const W=320,H=152,PAD={l:36,r:10,t:16,b:22};
  const mode=state.trend;
  let pts=[];
  if(mode==='month'){
    const[y0,m0]=ymParts(state.ym);
    for(let k=11;k>=0;k--){
      const d=new Date(y0,m0-k,1);
      const key=ymKey(d.getFullYear(),d.getMonth()+1);
      const v=entries.filter(e=>e.date.startsWith(key)&&e.type==='expense').reduce((s,e)=>s+e.amount,0);
      pts.push({key,label:`${d.getMonth()+1}月`,v,full:`${d.getFullYear()}年${d.getMonth()+1}月`});
    }
  }else{
    const ys={};
    entries.forEach(e=>{if(e.type!=='expense')return;const y=e.date.slice(0,4);ys[y]=(ys[y]||0)+e.amount});
    pts=Object.keys(ys).sort().map(y=>({key:y,label:y,v:ys[y],full:y})).slice(-8);
  }
  const box=$('trendChart');
  const max=Math.max(...pts.map(p=>p.v),0);
  if(!pts.length||max===0){box.innerHTML='<div class="empty" style="padding:36px 12px">还没有支出数据<br>记几笔后这里会出现趋势</div>';return}
  const iw=W-PAD.l-PAD.r,ih=H-PAD.t-PAD.b;
  // 美观刻度：向上取整到 1/2/5×10^n（数据峰值 12 → 上限 20）
  const niceCeil=v=>{
    if(v<=0)return 5;
    const p=Math.pow(10,Math.floor(Math.log10(v)));
    const n=v/p;
    return (n<=1?1:n<=2?2:n<=5?5:10)*p;
  };
  const top=niceCeil(max);
  const xy=pts.map((p,i)=>{
    const x=pts.length===1?PAD.l+iw/2:PAD.l+iw*i/(pts.length-1);
    return [Math.round(x*10)/10,Math.round((PAD.t+ih*(1-p.v/top))*10)/10,p];
  });
  const path=smoothPath(xy);
  const area=path+(pts.length>1?`L${xy[xy.length-1][0]},${H-PAD.b}L${xy[0][0]},${H-PAD.b}Z`:`L${xy[0][0]+30},${H-PAD.b}L${xy[0][0]-30},${H-PAD.b}Z`);
  const grid=[.25,.5,.75].map(f=>PAD.t+ih*f);
  const labelEvery=pts.length>6?Math.ceil(pts.length/6):1;
  let labels='';
  pts.forEach((p,i)=>{if(i%labelEvery===0)labels+=`<text class="trend-axis" x="${xy[i][0]}" y="${H-6}" text-anchor="middle">${p.label}</text>`});
  const dots=xy.map((p,i)=>`<circle class="trend-dot" cx="${p[0]}" cy="${p[1]}" r="2.6" data-i="${i}"/>`).join('');
  box.innerHTML=`<svg class="trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="支出趋势折线图">
    ${grid.map(y=>`<line class="grid-line" x1="${PAD.l}" y1="${y}" x2="${W-PAD.r}" y2="${y}"/>`).join('')}
    <text class="trend-axis trend-axis-cap" x="${PAD.l-4}" y="${PAD.t+4}" text-anchor="end">¥${Math.round(top)}</text>
    <text class="trend-axis" x="${PAD.l-4}" y="${H-PAD.b+4}" text-anchor="end">0</text>
    <line class="trend-crosshair" x1="0" y1="${PAD.t}" x2="0" y2="${H-PAD.b}" style="opacity:0"/>
    <circle class="trend-dot-active" cx="0" cy="0" r="5" style="opacity:0"/>
    <path class="trend-area" d="${area}"/>
    <path class="trend-line" d="${path}"/>
    ${dots}${labels}
  </svg>`;
  // 保存交互数据
  trendState={W,H,PAD,pts,xy,top};
  bindTrendInteractions();
  hideTrendTip();
}
function showTrendPoint(i){
  if(!trendState||!trendState.xy[i])return;
  const{pts:pl,xy}=trendState;const x=xy[i][0],y=xy[i][1];
  const svg=document.querySelector('#trendChart svg');
  if(!svg)return;
  const cross=svg.querySelector('.trend-crosshair'),dot=svg.querySelector('.trend-dot-active');
  cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.style.opacity='1';
  dot.setAttribute('cx',x);dot.setAttribute('cy',y);dot.style.opacity='1';
  const tip=$('trendTip'),tipD=$('tipDate'),tipV=$('tipVal');
  tipD.textContent=pl[i].full;
  tipV.textContent=`支出金额 ${fmt(pl[i].v)}`;
  tip.hidden=false;
  // 定位：默认放点上方居中，靠顶自动翻到下方，靠边自动收拢
  const r=svg.getBoundingClientRect();
  const rw=r.width||300,rh=r.height||142;
  const px=(x/trendState.W)*rw,py=(y/trendState.H)*rh;
  const pct=Math.min(88,Math.max(12,(px/rw)*100));
  tip.style.left=pct+'%';
  tip.style.top=(py/rh)*100+'%';
  tip.style.transform=py<46?'translate(-50%,12px)':'translate(-50%,calc(-100% - 10px))';
}
function bindTrendInteractions(){
  const svg=trendState&&$('trendChart').querySelector('svg');
  if(!svg||svg.dataset.bound)return;
  svg.dataset.bound='1';
  const pick=e=>{
    const r=svg.getBoundingClientRect();
    let x;
    if(r.width&&r.width>0)x=(e.clientX-r.left)/r.width*trendState.W;
    else if(e.offsetX!==undefined)x=e.offsetX; // SVG 中 offsetX 即 viewBox x
    else return;
    let bi=0,bd=1e9;
    trendState.xy.forEach((p,i)=>{const d=Math.abs(p[0]-x);if(d<bd){bd=d;bi=i}});
    showTrendPoint(bi);
  };
  svg.addEventListener('pointermove',pick);
  svg.addEventListener('pointerdown',pick);
  svg.addEventListener('pointerleave',hideTrendTip);
}
function hideTrendTip(){const tip=$('trendTip');if(tip)tip.hidden=true;const svg=trendState&&document.querySelector('#trendChart svg');if(svg){const c=svg.querySelector('.trend-crosshair'),d=svg.querySelector('.trend-dot-active');if(c)c.style.opacity='0';if(d)d.style.opacity='0'}}

const sheet=$('sheet'),backdrop=$('backdrop'),amountDisplay=$('amountDisplay');
function computeQuickAmounts(type){
  const freq={};
  entries.forEach(e=>{
    if(e.type!==type)return;
    const a=Math.round(e.amount);
    if(a>0)freq[a]=(freq[a]||0)+1;
  });
  const picked=Object.entries(freq)
    .filter(([,c])=>c>=2)
    .sort((a,b)=>b[1]-a[1]||a[0]-b[0])
    .map(x=>+x[0])
    .slice(0,6);
  if(type==='income'){
    // 收入默认只补一个 1500（不堆默认金额）
    if(!picked.includes(1500))picked.push(1500);
  }else{
    [8,15,20,32,50,100].forEach(d=>{if(picked.length<6&&!picked.includes(d))picked.push(d)});
  }
  return picked;
}

function initCatPager(track,dots){
  track.addEventListener('scroll',()=>{
    const w=track.clientWidth||1;
    const idx=Math.min(CAT_PAGES.length-1,Math.max(0,Math.round(track.scrollLeft/w)));

function pressKey(key){

    if(state.sheet.amount.includes('.')){const[,dec]=state.sheet.amount.split('.');if(dec.length>=2)return}
    if(state.sheet.amount==='0')state.sheet.amount=key;
    else if(state.sheet.amount.length<9)state.sheet.amount+=key;
  }
  refreshSheet();
}
document.querySelectorAll('#keypad .key, #keypadDesk .key').forEach(k=>k.addEventListener('click',()=>pressKey(k.dataset.k)));
// 物理键盘输入金额（数字键盘 / 顶部数字键）
document.addEventListener('keydown',e=>{
  if($('sheet').hidden)return;
  const tag=document.activeElement&&document.activeElement.tagName;
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(/^[0-9]$/.test(e.key)){pressKey(e.key);e.preventDefault()}
  else if(e.key==='.'){pressKey('.');e.preventDefault()}
  else if(e.key==='Backspace'){pressKey('back');e.preventDefault()}
  else if(e.key==='Enter'){e.preventDefault();$('saveBtn').click()}
  else if(e.key==='Escape'){closeSheet()}
});
$('saveBtn').addEventListener('click',()=>{
  const amt=parseFloat(state.sheet.amount);
  if(!amt||!state.sheet.cat)return;
  const date=$('dateInput').value||state.sheet.date||todayISO;
  if(state.sheet.editId){
    const e=entries.find(x=>x.id===state.sheet.editId);
    if(e){e.type=state.sheet.type;e.cat=state.sheet.cat;e.amount=amt;e.note=$('noteInput').value.trim();e.date=date;e.updatedAt=Date.now()}
  }else{
    entries.push({id:Date.now(),date,type:state.sheet.type,cat:state.sheet.cat,amount:amt,note:$('noteInput').value.trim(),updatedAt:Date.now()});
  }
  save();closeSheet();render();
  if(state.view==='stats')setView('bills');
  uploadAggregate();
});
$('delBtn').addEventListener('click',()=>{
  if(!state.sheet.editId)return;
  const id=state.sheet.editId;
  entries=entries.filter(x=>x.id!==id);
  if(sbReady()){
    // 记录墓碑，由 sbPush 统一上传，防止被全量推送复活
    tombIds.push(id);saveTomb();
    sbPush();
  }
  save();closeSheet();render();
  uploadAggregate();
});

/* 搜索 */
$('searchInput').addEventListener('input',e=>{state.query=e.target.value;$('searchClear').hidden=!state.query;renderBills()});
$('searchClear').addEventListener('click',()=>{$('searchInput').value='';state.query='';$('searchClear').hidden=true;renderBills();$('searchInput').focus()});

/* 同步设置 */
function openSettings(){
  $('setUrl').value=sbCfg?sbCfg.url:'';
  $('setKey').value=sbCfg?sbCfg.key:'';
  $('setOwner').value=sbCfg?sbCfg.owner:'';
  $('disconnectBtn').hidden=!sbCfg;
  const st=$('setStatus');
  st.className='set-status'+(sbCfg?' ok':'');
  st.textContent=sbCfg?'已连接，本地优先、云端自动同步':'未配置——填好下方三项即可开启双端同步';
  $('settingsSheet').hidden=false;$('settingsBackdrop').hidden=false;
  document.body.style.overflow='hidden';
}
function closeSettings(){$('settingsSheet').hidden=true;$('settingsBackdrop').hidden=true;document.body.style.overflow=''}
$('settingsBtn').addEventListener('click',openSettings);
$('closeSettings').addEventListener('click',closeSettings);
$('settingsBackdrop').addEventListener('click',closeSettings);
$('syncSaveBtn').addEventListener('click',async()=>{
  const url=$('setUrl').value.trim(),key=$('setKey').value.trim(),owner=$('setOwner').value.trim();
  const st=$('setStatus');
  if(!url||!key||!owner){st.textContent='三项都要填';st.className='set-status err';return}
  sbCfg={url,key,owner};
  localStorage.setItem(sbCfgKey,JSON.stringify(sbCfg));
  sbInit();
  if(!sbReady()){st.textContent='无法初始化连接，请检查 URL 和 anon key';st.className='set-status err';return}
  st.textContent='正在同步…';st.className='set-status';
  try{
    await sync();
    st.textContent='同步完成。另一台设备填同一套配置打开即可互通。';
    st.className='set-status ok';
    $('disconnectBtn').hidden=false;
  }catch(e){
    st.textContent='同步失败：'+(e.message||'未知错误');
    st.className='set-status err';
  }
});
$('disconnectBtn').addEventListener('click',()=>{
  sbCfg=null;sb=null;
  localStorage.removeItem(sbCfgKey);
  $('disconnectBtn').hidden=true;
  const st=$('setStatus');
  st.textContent='已断开云端同步，数据保留在本地。';
  st.className='set-status';
});
$('wipeBtn').addEventListener('click',()=>{
  if(!confirm('确定清空所有记账数据？本地和云端都会删掉，不可恢复。'))return;
  const wipe=async()=>{
    entries=[];budgets={};tombIds=[];saveTomb();
    if(sbReady()){
      try{await sb.from('entries').delete().gt('id',-1)}catch(e){console.warn('wipe cloud entries',e)}
      try{await sb.from('budgets').delete().neq('cat','__none__')}catch(e){console.warn('wipe cloud budgets',e)}
    }
    save();saveBudgets();render();
    const st=$('setStatus');
    st.textContent='已清空所有数据，现在从零开始。';
    st.className='set-status ok';
  };
  wipe();
});

if(sbReady())sync();

document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!$('settingsSheet').hidden)closeSettings();
    else if(!$('budgetSheet').hidden)closeBudgetSheet();
    else if(!sheet.hidden)closeSheet();
  }
});
</script>
</body>
</html>
